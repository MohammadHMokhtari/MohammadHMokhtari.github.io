name: Build and test DarsBridge 0.9
on:
  push:
    branches: [darsbridge-v09]
    paths:
      - darsbridge-v09/project/**
      - darsbridge-v09/tools/**
      - .github/workflows/build-darsbridge-v09.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: darsbridge-v09-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager --channel=3 'platforms;android-37.2' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Unit tests, lint and APK
        run: gradle -p darsbridge-v09/project :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 recovery, proxy routing, WebRTC, theme and backup tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            gradle -p darsbridge-v09/project :app:connectedDebugAndroidTest --no-daemon --stacktrace
            mkdir -p build-output
            adb install -r darsbridge-v09/project/app/build/outputs/apk/debug/app-debug.apk
            adb shell cmd uimode night yes
            adb shell am start -W -n com.darsbridge.app.v09/com.darsbridge.app.MainActivity
            sleep 3
            adb exec-out screencap -p > build-output/home-dark.png
            adb shell cmd uimode night no
            sleep 3
            adb exec-out screencap -p > build-output/home-light.png
      - name: Build ARM64 phone APK
        run: gradle -p darsbridge-v09/project :app:assembleDebug -PphoneAbi=arm64-v8a --no-daemon --stacktrace
      - name: Verify and package output
        run: |
          mkdir -p build-output
          cp darsbridge-v09/project/app/build/outputs/apk/debug/app-debug.apk build-output/DarsBridge-0.9.apk
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build-output/DarsBridge-0.9.apk') as z:
              names = z.namelist()
              assert 'lib/arm64-v8a/libtor.so' in names
              assert not any(n.startswith(('lib/x86/', 'lib/x86_64/', 'lib/armeabi-v7a/')) for n in names)
              assert z.testzip() is None
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose build-output/DarsBridge-0.9.apk
          cd build-output && sha256sum DarsBridge-0.9.apk > SHA256SUMS.txt
      - name: Collect verified CI evidence
        run: python3 darsbridge-v09/tools/ci_report.py
      - name: Archive complete readable source
        if: always()
        run: |
          mkdir -p build-output
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('darsbridge-v09/project')
          with ZipFile('build-output/DarsBridge-0.9-source.zip','w',ZIP_DEFLATED) as z:
              if root.exists():
                  for p in sorted(root.rglob('*')):
                      rel = p.relative_to(root)
                      if p.is_file() and not any(x in ('build','.gradle','.kotlin') for x in rel.parts):
                          z.write(p,'DarsBridge-0.9/'+str(rel))
              for name in ('README_FA.md','REVIEW_FA.md','STATUS.json','SECURITY_TESTS_FA.md'):
                  p=Path('darsbridge-v09')/name
                  if p.exists(): z.write(p,'review/'+name)
              for name in ('release-manifest.json','CI_REPORT_FA.md'):
                  p=Path('build-output')/name
                  if p.exists(): z.write(p,'verification/'+name)
          PY
      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: DarsBridge-0.9-APK
          path: |
            build-output/DarsBridge-0.9.apk
            build-output/SHA256SUMS.txt
            build-output/release-manifest.json
            build-output/CI_REPORT_FA.md
          if-no-files-found: error
          retention-days: 14
      - name: Upload reports, source and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarsBridge-0.9-QA
          path: |
            darsbridge-v09/project/app/build/reports/
            darsbridge-v09/project/app/build/test-results/
            darsbridge-v09/project/app/build/outputs/androidTest-results/
            build-output/home-dark.png
            build-output/home-light.png
            build-output/DarsBridge-0.9-source.zip
            build-output/release-manifest.json
            build-output/CI_REPORT_FA.md
          retention-days: 14
